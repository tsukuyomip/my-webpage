name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mixer/package-lock.json
            media-vault/package-lock.json
            gkms-sprtcrd/package-lock.json
            train-sandbox/package-lock.json
            make-medley/package-lock.json
            sensitive-font/package-lock.json
            yt-rhythm/package-lock.json
            shot-bank/package-lock.json

      - name: Build mixer
        working-directory: mixer
        run: |
          npm ci
          npm run build

      - name: Build make-medley
        working-directory: make-medley
        run: |
          npm ci
          npm run build

      - name: Build media-vault
        working-directory: media-vault
        run: |
          npm ci
          npm run build

      - name: Build gkms-sprtcrd
        working-directory: gkms-sprtcrd
        run: |
          npm ci
          npm run build

      - name: Build train-sandbox
        working-directory: train-sandbox
        run: |
          npm ci
          npm run build

      - name: Build sensitive-font
        working-directory: sensitive-font
        run: |
          npm ci
          npm run build

      - name: Build yt-rhythm
        working-directory: yt-rhythm
        run: |
          npm ci
          npm run build

      - name: Build shot-bank
        working-directory: shot-bank
        run: |
          npm ci
          npm run build

      - name: Assemble site (root static page + /mixer/ + /make-medley/ + /media-vault/ + /gkms-sprtcrd/ + /train-sandbox/ + /sensitive-font/ + /yt-rhythm/ + /shot-bank/ + /dopamine_calc/ + /dopamine-slot/ + /tmmn-house/ + /toio/ + /yt-dlp-lab/)
        run: |
          mkdir -p _site/mixer _site/make-medley _site/media-vault _site/gkms-sprtcrd _site/train-sandbox _site/sensitive-font _site/yt-rhythm _site/shot-bank _site/dopamine_calc _site/dopamine-slot
          cp index.html style.css _site/
          cp -r mixer/dist/* _site/mixer/
          cp -r make-medley/dist/* _site/make-medley/
          cp -r media-vault/dist/* _site/media-vault/
          cp -r gkms-sprtcrd/dist/* _site/gkms-sprtcrd/
          cp -r train-sandbox/dist/* _site/train-sandbox/
          cp -r sensitive-font/dist/* _site/sensitive-font/
          cp -r yt-rhythm/dist/* _site/yt-rhythm/
          cp -r shot-bank/dist/* _site/shot-bank/
          # dopamine_calc / dopamine-slot はビルド不要の静的アプリなのでそのままコピー
          cp dopamine_calc/index.html dopamine_calc/style.css dopamine_calc/app.js _site/dopamine_calc/
          cp dopamine-slot/index.html dopamine-slot/style.css dopamine-slot/app.js _site/dopamine-slot/
          # tmmn-house もビルド不要。data/ src/ images/ を含むのでディレクトリごとコピーする
          cp -r tmmn-house _site/tmmn-house
          # toio 配下もビルド不要の静的アプリ。今後ページが増えてもいいようにまるごとコピーする
          cp -r toio _site/toio
          # yt-dlp-lab も同様。py/ と extension/ を含むのでディレクトリごと運ぶ
          cp -r yt-dlp-lab _site/yt-dlp-lab

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
